<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninja vs Evil Corp: Rage Run</title>
<style>
:root{
  --bg:#07080d;--panel:#0d111aee;--line:#283245;--text:#f4f7ff;--muted:#9aa8bf;
  --cyan:#55e7ff;--red:#ff4f65;--gold:#ffd45c;--green:#62ff9a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body, canvas, #ui {touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#0a0d13}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92vw,560px);max-height:90vh;overflow:auto;padding:22px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0009;backdrop-filter:blur(10px)}
h1{margin:0 0 4px;font-size:34px}
h2{margin:0 0 12px;font-size:24px}
.sub{color:var(--muted);line-height:1.4;margin-bottom:14px}
.row{display:flex;gap:9px;flex-wrap:wrap}
button{border:1px solid #34425d;background:#121927;color:var(--text);padding:11px 15px;border-radius:12px;font-size:15px;cursor:pointer}
button.primary{background:linear-gradient(135deg,#8d2037,#41257c);border-color:#8a4b63}
button.good{background:#143c2b;border-color:#2e7b56}
button.danger{background:#431520;border-color:#7c2d40}
button:disabled{opacity:.4;cursor:not-allowed}
#hud{display:none;position:absolute;left:12px;right:12px;top:10px;z-index:100;}
.hudrow{display:flex;justify-content:space-between;gap:7px;align-items:center}
.hudbox{background:#080b12cc;border:1px solid #293447;border-radius:10px;padding:7px 10px;font-size:13px}
.hidden{display:none!important}.visible{display:block!important}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);display:none;
  font-weight:900;font-size:26px;text-align:center;text-shadow:0 4px 18px #000;pointer-events:none}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
.tgroup{position:absolute;bottom:15px;display:grid;gap:10px;pointer-events:auto}
#move{left:15px;grid-template-columns:74px 74px}
#act{right:15px;grid-template-columns:74px 74px}
.t{width:74px;height:74px;border-radius:20px;background:#090d16bb;border:1px solid #ffffff2a;
display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;user-select:none}
.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:58vh;overflow:auto}
.lv{min-height:62px;padding:7px 2px;font-size:12px}
.lv b{font-size:16px}.stars{color:var(--gold);display:block;min-height:16px}
#tip{margin-top:12px;padding:9px;background:#111725;border-left:3px solid var(--red);border-radius:8px;color:#c4ccdb}
@media (pointer:coarse){#touch{display:block}}
@media (max-width:600px){h1{font-size:28px}.panel{padding:17px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="menu" class="panel">
    <h1>Ninja vs Evil Corp</h1>
    <div class="sub"><b>RAGE RUN</b> — Developed by Ritik. 30 levels of pure rage.</div>
    <div class="row">
      <button class="primary" id="play">Continue</button>
      <button id="levels">Levels</button>
      <button id="about">How to Play</button>
      <button id="toggleSound">Sound: ON</button>
      <button id="uploadChar" onclick="uploadCharacter()">Upload Character</button><button id="resetSave" class="danger">Reset Save</button>
    </div>
    <div id="tip">Rule #1: Do not trust the game.</div>
  </div>

  <div id="hud">
    <div class="hudrow">
      <div class="hudbox" id="hLevel">Level 1</div>
      <button class="hudbox" id="hDeaths" style="cursor:pointer; background:transparent; border:1px solid #293447; color:var(--text); pointer-events:auto;" onpointerdown="toggleCheat(this)">Deaths: 0</button>
      <div class="hudbox" id="hTime">0.0s</div>
      <div class="hudbox" id="hCoins">Coins: 0</div>
      <button class="hudbox" id="hSettings" style="cursor:pointer; background:#2b3443; border:1px solid #34425d; color:#fff; pointer-events:auto; font-size:16px;" onpointerdown="showSettings(); return false;">⚙</button>
      <div class="hudbox" id="hHint" style="color:var(--cyan); max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
    </div>
  </div>


  <div id="settingsPanel" class="panel" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:100; text-align:center;">
    <h2>Game Paused</h2>
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button onclick="uploadCharacter()" style="margin:5px; width:200px;">Change Character</button>
      <button onclick="openLevelsFromGame()" style="margin:5px; width:200px;">Levels</button>
      <button onclick="restartLevelFromSettings()" style="margin:5px; width:200px;">Restart Level</button>
      <button id="inGameSoundToggle" onclick="toggleInGameSound()" style="margin:5px; width:200px;">Sound: ON</button>
      <button onclick="exitToMenuFromSettings()" style="margin:5px; width:200px;" class="danger">Exit to Menu</button>
      <button onclick="hideSettings()" style="margin:5px; width:200px;" class="primary">Resume</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="touch">
    <div id="move" class="tgroup">
      <div class="t" data-k="left">◀</div><div class="t" data-k="right">▶</div>
    </div>
    <div id="act" class="tgroup">
      <div class="t" data-k="jump">▲</div><div class="t" data-k="dash">D</div>
      <div class="t" data-k="attack">⚔</div><div class="t" data-k="reset">R</div>
    </div>
  </div>
</div>

function playExternalSound(id) {
  if (!soundEnabled) return;
  try {
    if (id === 'bkl') { audioBkl.currentTime = 0; audioBkl.play().catch(()=>{}); }
    if (id === 'fake') { audioFake.currentTime = 0; audioFake.play().catch(()=>{}); }
    if (id === 'aag') { audioAag.currentTime = 0; audioAag.play().catch(()=>{}); }
  } catch(e) {}
}
function playSound(type) {
  if (!soundEnabled) return;
  if (!audioCtx) { try { audioCtx = new AudioContext(); } catch(e) { return; } }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'coin') { osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.05); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'die') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
  else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
  else if (type === 'hit') { osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
  else if (type === 'dash') { osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.15); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
  else if (type === 'cp') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); }
}

let customCharImage = null;
try {
  let stored = localStorage.getItem('custom_char');
  if(stored) {
    customCharImage = new Image();
    customCharImage.src = stored;
  }
} catch(e) {}
function uploadCharacter() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png, image/jpeg, image/x-icon, image/gif';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      customCharImage = new Image();
      customCharImage.src = ev.target.result;
      try { localStorage.setItem('custom_char', ev.target.result); } catch(err) {}
      alert("Character updated!");
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

  if(["arrowleft","arrowright","arrowup"," ","z","x","r"].includes(e.key.toLowerCase()) && !e.ctrlKey && !e.metaKey) e.preventDefault();
  if(e.key.toLowerCase()==="escape"&&state==="play")pause();
  if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==="o"){
    e.preventDefault();
    ritikAdmin=!ritikAdmin;
  }
},{passive:false});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouchEnd<=300 && e.target.tagName !== 'BUTTON') e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.querySelectorAll(".t").forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();touch[k]=true};
  const up=e=>{e.preventDefault();touch[k]=false};
  b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);
  b.addEventListener("pointercancel",up);b.addEventListener("pointerout",up);
});

function rand(seed){let x=seed>>>0;return()=>((x=x*1664525+1013904223>>>0)/4294967296)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rect(x,y,w,h,kind="",extra={}){return {id:nextId++,x,y,w,h,kind,...extra}}
function generateLevel(lv){
  const r=rand(lv.seed), L=lv.length;
  const d=clamp((lv.id-1)/(levels.length-1),0,1); // 0 on level 1, 1 on the final level
  platforms=[rect(0,420,360,60,"solid"),rect(390,390,180,60,"solid"),rect(600,340,170,60,"solid")];
  hazards=[];coins=[];enemies=[];checkpoints=[];
  let x=780,y=300;
  let fakeChance=.03+d*.14, crumbChance=.03+d*.14, movingChance=.02+d*.12;
  let spikeChance=.10+d*.28, fireChance=.05+d*.22, enemyChance=.04+d*.16;
  let checkpointChance=.16-d*.08;
  const fakeCpChance = 0.05 + d*0.15;
  const gapMin=40+d*20, gapRange=70+d*70, widthRange=140-d*30;
  let checkpointPending=false;
  let gapMinL=gapMin, gapRangeL=gapRange, widthRangeL=widthRange, yRange=150;
  let blinkChance=.05+d*.10;
  let stretchChance=.04+d*.08;
  if(lv.id === 1) { 
    fakeChance = 0.05; crumbChance = 0; movingChance = 0; spikeChance = 0; fireChance = 0; enemyChance = 0; blinkChance = 0; stretchChance = 0;
    gapMinL = 10; gapRangeL = 40; widthRangeL = 200; yRange = 40;
  }

  if (lv.mode === "trap") { fakeChance *= 2.5; crumbChance *= 2; spikeChance *= 1.5; stretchChance *= 1.5; }
  else if (lv.mode === "gauntlet") { enemyChance *= 2.5; fireChance *= 2; checkpointChance = 0; }
  else if (lv.mode === "timed") { movingChance *= 3; spikeChance *= 1.5; stretchChance *= 2; }
  else if (lv.mode === "keys") { movingChance *= 1.5; enemyChance *= 1.5; }

  while(x<L-260){
    const gap=gapMinL+r()*gapRangeL, w=90+r()*widthRangeL;
    x+=gap;
    if(lv.id === 1) y = 250 + r()*40;
    else y = Math.max(200, Math.min(420, y + (r() - 0.4) * 200));
    const troll=r();
    let kind="solid";
    if(troll<fakeChance) kind="fake";
    else if(troll<fakeChance+crumbChance) kind="crumb";
    else if(troll<fakeChance+crumbChance+movingChance) kind="moving";
    else if(troll<fakeChance+crumbChance+movingChance+0.05) kind="phantom";
    else if(troll<fakeChance+crumbChance+movingChance+0.05+blinkChance) kind="blink";
    else if(troll<fakeChance+crumbChance+movingChance+0.05+blinkChance+stretchChance) kind="stretch";

    const p=rect(x,y,w,28,kind,{baseY:y,baseW:w,amp:40+r()*50,phase:r()*Math.PI*2,speed:.8+r()*1.2});
    p.id = platforms.length;
    platforms.push(p);

    let hasCheckpoint = false;
    if(checkpointPending && kind==="solid"){
      checkpoints.push({x:x+Math.min(28,w-18),y:y-18,used:false,safe:true});
      checkpointPending=false;
      hasCheckpoint = true;
    }

    let hazardHere=false;
    if(!hasCheckpoint){
      if(r()<spikeChance){hazards.push(rect(x+w*.55,y-30,28,30,"spike"));hazardHere=true}
      if(r()<fireChance){hazards.push(rect(x+w*.15,y+28,Math.min(90,w*.7),18,"fire"));hazardHere=true}
    }
    
    if(r()<.35) {
       if(r()<.2) coins.push({x:x+w*.5,y:y-35,got:false, fake:true});
       else coins.push({x:x+w*.5,y:y-35,got:false, fake:false});
    }
    
    if(r()<enemyChance && !hasCheckpoint) enemies.push({x:x+w-40,y:y-38,w:28,h:38,dir:r()<.5?-1:1,speed:40+r()*50});

    if(x+w<L-400){
      if(hazardHere) checkpointPending=true;
      else if(r()<checkpointChance && kind==="solid" && !hasCheckpoint){
        checkpoints.push({x:x+w*.5,y:y-18,used:false,safe:true});
      } else if (!hasCheckpoint && kind==="solid" && r()<fakeCpChance) {
        checkpoints.push({x:x+w*.5,y:y-18,used:false,safe:false}); // fake cp
      }
    }
    x+=w;
  }

  platforms.push(rect(L-280,330,150,28,"solid"));
  platforms.push(rect(L-90,282,64,48,"exit",{active:true,label:"GATE"}));

  if(lv.id%5===0){
    hazards.push(rect(L-190,290,18,40,"spike"));
    coins.push({x:L-120,y:210,got:false});
  }
  if(lv.id%7===0) platforms.push(rect(L-420,180,170,28,"fake"));

  if(checkpointPending){
    checkpoints.push({x:L-245,y:312,used:false,safe:true});
  }
  enemies = enemies.filter(e => !checkpoints.some(cp => Math.abs(e.x - cp.x) < 220));
  return {L};
}

function resetPlayer(full=true){
  player={
    x:spawn.x,y:spawn.y,w:30,h:42,vx:0,vy:0,onGround:false,face:1,
    hp:1,attack:0,dash:0,coyote:0,jumpBuffer:0,checkpoint:{...spawn}
  };
  if(full){levelTime=0;complete=false}
}
function start(n){
  level=levels[n-1]||levels[0];state="play";paused=false;complete=false;deaths=0;levelTime=0;
  generateLevel(level);
  const safe=platforms.find(p=>p.kind==="solid");spawn={x:90,y:safe.y-48};
  resetPlayer();cameraX=0;toast(worlds[level.world].name+" — "+tricks[(level.id-1)%tricks.length],2.2);
  showGameUI();
}
function respawn(reason=null){
  deaths++;shake=10;levelTime+=0.7;
  if(reason==="spike") playExternalSound('bkl');
  else if(reason==="fake") playExternalSound('fake');
  else if(reason==="fall") playExternalSound('aag');
  else playSound('die');

  if(deaths % 3 === 0 && !ritikAdmin) {
    toast("3 DEATHS! RESTARTING LEVEL...", 2);
    player.checkpoint = {...spawn};
    checkpoints.forEach(cp => cp.used = false);
  }
  resetAtCheckpoint();
}
function resetAtCheckpoint(){player.x=player.checkpoint.x;player.y=player.checkpoint.y;player.vx=0;player.vy=0;player.attack=0;player.dash=0}

function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function solidPlatforms(){
  const now=performance.now()/1000;
  for(const p of platforms){
    if(p.kind==="moving")p.y=p.baseY+Math.sin(now*p.speed+p.phase)*p.amp;
    if(p.kind==="stretch")p.w=Math.max(10, p.baseW + Math.sin(now*p.speed*1.5+p.phase)*(p.baseW*0.75));
  }
}
function update(dt){
  if(state!=="play"||paused)return;
  const now = performance.now()/1000;
  levelTime+=dt;totalTime+=dt;solidPlatforms();
  const inp=input();
  if(inp.reset){if(!keys.__resetLock){keys.__resetLock=true;resetAtCheckpoint();setTimeout(()=>keys.__resetLock=false,150)}} else keys.__resetLock=false;

  player.attack=Math.max(0,player.attack-dt);
  player.dash=Math.max(0,player.dash-dt);
  player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  if(inp.jump)player.jumpBuffer=.12;

  const accel=1100, max=310, friction=0.82;
  if(inp.left){player.vx-=accel*dt;player.face=-1}
  if(inp.right){player.vx+=accel*dt;player.face=1}
  if(!inp.left&&!inp.right)player.vx*=Math.pow(friction,dt*60);
  player.vx=clamp(player.vx,-max,max);

  if(inp.dash&&player.dash<=0){
    player.vx+=player.face*520;player.dash=.65;shake=4;playSound('dash');
  }
  if(inp.attack){player.attack=.16}
  player.vy+=1180*dt;
  const wasGround=player.onGround;player.onGround=false;
  if(player.jumpBuffer>0&& (wasGround||player.coyote>0)){player.vy=-520;player.jumpBuffer=0;player.coyote=0;playSound('jump');}
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  for(const p of platforms){
    if(p.kind==="phantom")continue;
    if(p.kind==="blink" && Math.sin(now*2.5 + p.id*1.3) < 0) continue;
    if(p.kind==="fake"&&p.revealed)continue;
    if(p.kind==="fake"&&!p.revealed&&aabb(player,{...p,y:p.y-1,h:p.h+2})){
      if(!p._timer) p._timer = 0.1;
      p._timer -= dt;
      if(p._timer<=0){p.revealed=true;toast("TRICKED! FAKE PLATFORM LOL!", 2.5);playExternalSound('fake');}
    }
    if(aabb(player,p)&&player.vy>=0&&player.y+player.h-player.vy*dt<=p.y+8){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;player.coyote=.11;
      if(p.kind==="crumb"){p.w=Math.max(0,p.w-dt*50);if(p.w<15){p.kind="broken";toast("Platform dissolved! Get baited!", 2.5);}}
    }
  }
  if(!player.onGround)player.coyote=Math.max(0,player.coyote-dt);

  for(const h of hazards){
    if(ritikAdmin)continue;
    if(aabb(player,h)){respawn(h.kind==="spike"?"spike":null);break}
  }

  for(const e of enemies){
    e.x+=e.dir*e.speed*dt;
    if(Math.abs(e.x-player.x)>170)e.dir*=-1;
    if(aabb(player,e)&&player.attack>0){e.dead=true;shake=6;playSound('hit');}
    else if(aabb(player,e)){
      if(ritikAdmin){e.dead=true;shake=6;playSound('hit');}
      else{respawn();toast("Security has filed your complaint.",.8);break}
    }
  }
  enemies=enemies.filter(e=>!e.dead);

  for(const cp of checkpoints){
    const nearX=Math.abs((player.x+player.w/2)-cp.x)<34;
    const nearY=Math.abs((player.y+player.h)-cp.y)<52;
    if(!cp.used&&nearX&&nearY){
      if(!cp.safe) { cp.used = true; toast("FAKE CHECKPOINT! LOL", 1.5); if(!ritikAdmin) respawn("fake"); }
      else {
        cp.used=true;
        player.checkpoint={x:cp.x-15,y:cp.y-player.h};
        toast("Checkpoint activated.",1);playSound('cp');
      }
    }
  }
  for(const coin of coins){
    if(!coin.got&&Math.hypot(player.x-coin.x,player.y-coin.y)<35){
      coin.got=true;
      if(coin.fake) { toast("THAT WAS NOT A COIN.", 1.5); if(!ritikAdmin) respawn("fake"); }
      else { save.coins++;write();playSound('coin'); }
    }
  }

  // Deliberate ragebait: some exits are fake and send you backward.
  const exit=platforms.find(p=>p.kind==="exit");
  if(exit && player.x <= exit.x+exit.w && player.x+player.w >= exit.x && player.y <= exit.y+exit.h && player.y+player.h >= exit.y){
    if(level.id%6===0 && !exit.used){
      exit.used=true;
      if(!ritikAdmin) { player.x=Math.max(50,player.x-420);player.vy=-350;toast("FAKE EXIT. Incredible.",1.4);shake=8;playExternalSound('fake'); }
    }
    else if (exit.used && level.id%6===0) { /* Wait for real exit */ }
    else finish();
  }

  if(player.y>620){
    if(ritikAdmin){player.y=100;player.vy=0}
    else respawn("fall");
  }
  cameraX += ((player.x-W*.35)-cameraX)*Math.min(1,dt*5);
  cameraX=clamp(cameraX,0,Math.max(0,level.length-W));
  shake=Math.max(0,shake-dt*22);
  elHLevel.textContent=`L${level.id} · ${worlds[level.world].name}`;
  elHDeaths.textContent=`Deaths: ${deaths}`;
  elHTime.innerHTML=`<span style="font-size:1.2em; font-weight:bold;">Developer: Ritik</span>`;
  elHCoins.textContent=`Coins: ${save.coins}`;
  elHHint.textContent=`Hint: ${tricks[(level.id-1)%tricks.length]}`;
}

function finish(){
  if(complete)return;complete=true;playSound('win');
  let stars=3;
  if(deaths>3)stars=2;
  if(deaths>8)stars=1;
  if(levelTime>35+level.id*1.2)stars=Math.min(stars,2);
  save.stars[level.id]=Math.max(save.stars[level.id]||0,stars);
  if(save.unlocked===level.id&&save.unlocked<30)save.unlocked++;
  save.coins+=25+stars*10;write();
  toast(`LEVEL ${level.id} CLEARED — ${"★".repeat(stars)}${"☆".repeat(3-stars)}`,2);
  setTimeout(() => { if(level.id < 30) start(level.id+1); else results(); }, 1800);
}

  const p=elMenu;
  p.style.display="block";

    <div class="row">${level.id<30?`<button class="primary" id="next">Next Level</button>`:""}<button id="retry">Retry</button><button id="lev">Levels</button><button id="home">Menu</button></div>`;
  if(document.getElementById("next"))document.getElementById("next").onclick=()=>start(level.id+1);
  document.getElementById("retry").onclick=()=>start(level.id);
  document.getElementById("lev").onclick=levelsUI;
  document.getElementById("home").onclick=menuUI;

function drawBackground(){
  const w=worlds[level.world],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,w.bg);g.addColorStop(1,"#07090e");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.22;
  const time = performance.now()/1000; const now = time;
  for(let i=0;i<150;i++){let x=(i*30-(cameraX*.3)%30);let hh=40+Math.sin(time*5+i)*15+Math.cos(time*8+i*1.3)*10;ctx.fillStyle="#ff4f65";ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+15,H-hh);ctx.lineTo(x+30,H);ctx.fill();ctx.fillStyle="#ff8d30";ctx.beginPath();ctx.moveTo(x+7,H);ctx.lineTo(x+15,H-hh*.6);ctx.lineTo(x+23,H);ctx.fill();}
  ctx.globalAlpha=0.04;
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=1;
  ctx.beginPath();
  const ox = -(cameraX*0.05)%60, oy = -(cameraX*0.05)%60;
  for(let x=ox;x<W;x+=60){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=oy;y<H;y+=60){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  ctx.globalAlpha=1;
}
function draw(){
  const now = performance.now()/1000;
  if(state==="menu"||state==="results"){ctx.fillStyle="#07080d";ctx.fillRect(0,0,W,H);return}
  drawBackground();
  ctx.save();
  const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
  ctx.translate(-cameraX+sx,sy);

  for(const p of platforms){
    if(p.kind==="broken"||p.w<=0)continue;
    let alpha = 1;
    if(p.kind==="blink") { if(Math.sin(now*2.5 + p.id*1.3) < 0) alpha = 0.15; }
    ctx.globalAlpha = alpha;
    ctx.fillStyle=p.kind==="fake"?"#382536":p.kind==="crumb"?"#57452c":p.kind==="moving"?"#30485a":p.kind==="stretch"?"#3a5530":p.kind==="blink"?"#4a2a4a":"#273443";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle=p.kind==="fake"?"#ff4f65":p.kind==="blink"?"#e84be8":p.kind==="stretch"?"#70f555":"#55e7ff";ctx.fillRect(p.x,p.y,p.w,4);
    if(p.kind==="fake"){ctx.fillStyle="#ff4f6540";ctx.fillRect(p.x+4,p.y+8,p.w-8,3)}
    ctx.globalAlpha = 1;
  }

  for(const h of hazards){
    if(h.kind==="spike"){
      ctx.fillStyle="#ff4f65";
      for(let x=h.x;x<h.x+h.w;x+=9){ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+4.5,h.y);ctx.lineTo(x+9,h.y+h.h);ctx.fill()}
    }else{ctx.fillStyle="#ff8d30";ctx.fillRect(h.x,h.y,h.w,h.h);ctx.fillStyle="#ffd45c";ctx.fillRect(h.x+4,h.y+4,h.w-8,4)}
  }

  for(const cp of checkpoints){
    ctx.fillStyle=cp.used?"#62ff9a":"#2f9e67";
    ctx.fillRect(cp.x-12,cp.y-22,24,22);
    ctx.fillStyle="#b8ffd1";
    ctx.fillRect(cp.x-7,cp.y-17,14,5);
    ctx.fillRect(cp.x-3,cp.y-11,6,7);
  }
  for(const coin of coins)if(!coin.got){
    ctx.fillStyle="#ffd45c";ctx.beginPath();ctx.arc(coin.x,coin.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff3a2";ctx.fillRect(coin.x-2,coin.y-5,4,10);
    if(coin.fake) { ctx.fillStyle="#ff4f65"; ctx.fillRect(coin.x-2, coin.y-2, 4, 4); }
  }

  for(const e of enemies){
    ctx.fillStyle="#eaeef7";ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.fillStyle="#ff4f65";ctx.fillRect(e.x+5,e.y+9,18,7);
    ctx.fillStyle="#1a202d";ctx.fillRect(e.x+4,e.y+25,7,13);ctx.fillRect(e.x+18,e.y+25,7,13)
  }

  const x=player.x,y=player.y;
  ctx.fillStyle="#0008";ctx.fillRect(x-5,y+player.h-3,40,8);
  if (customCharImage && customCharImage.complete && customCharImage.width > 0) {
    if (player.face < 0) {
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(customCharImage, -x - player.w, y, player.w, player.h);
      ctx.restore();
    } else {
      ctx.drawImage(customCharImage, x, y, player.w, player.h);
    }
  } else {
    ctx.fillStyle="#171d2c";ctx.fillRect(x,y,player.w,player.h);
    ctx.fillStyle="#d9f0ff";ctx.fillRect(x+4,y+5,22,15);
    ctx.fillStyle="#ff4f65";ctx.fillRect(player.face>0?x+22:x-4,y+10,8,5);
    ctx.fillStyle="#0a0d14";ctx.fillRect(x+5,y+25,7,17);ctx.fillRect(x+19,y+25,7,17);
  }
  if(player.attack>0){
    ctx.strokeStyle="#55e7ff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(x+15+(player.face*18),y+20,30,-1.0,1.0);ctx.stroke()
  }
  const ex=platforms.find(p=>p.kind==="exit");
  if(ex){
    const pulse=1+Math.sin(performance.now()/180)*.08;
    ctx.save();
    ctx.translate(ex.x+ex.w/2,ex.y+ex.h/2);
    ctx.scale(pulse,pulse);
    ctx.fillStyle="#62ff9a";
    ctx.fillRect(-ex.w/2,-ex.h/2,ex.w,ex.h);
    ctx.strokeStyle="#d9ffe7";
    ctx.lineWidth=3;
    ctx.strokeRect(-ex.w/2,-ex.h/2,ex.w,ex.h);
    ctx.fillStyle="#07130c";
    ctx.font="bold 12px system-ui";
    ctx.textAlign="center";
    ctx.fillText("GATE",0,4);
    ctx.restore();
  }
  ctx.restore();

  ctx.fillStyle="#ffffff14";ctx.fillRect(0,H-4,W,4);
  elToast.style.display=toastTimer>0?"block":"none";
}
function frame(now){
  const dt=Math.min(.033,(now-(window.__last||now))/1000);window.__last=now;
  if(toastTimer>0)toastTimer-=dt;
  update(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.showSettings = showSettings;
window.hideSettings = hideSettings;
window.restartLevelFromSettings = restartLevelFromSettings;
window.exitToMenuFromSettings = exitToMenuFromSettings;
window.uploadCharacter = uploadCharacter;
window.levelsUI = levelsUI;
window.openLevelsFromGame = function() {
  hideSettings();
  state = "menu";
  elMenu.classList.remove("hidden");
  elHud.classList.remove("visible");
  elTouch.style.display = "none";
  levelsUI();
};
window.toggleInGameSound = function() {
  soundEnabled = !soundEnabled;
  if(!soundEnabled){try{audioBkl.pause();audioFake.pause();audioAag.pause();}catch(e){}}
  const tGame = document.getElementById('inGameSoundToggle');
  const tMenu = document.getElementById('toggleSound');
  if(tGame) tGame.textContent = 'Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  if(tMenu) tMenu.textContent = 'Sound: ' + (soundEnabled ? 'ON' : 'OFF');
};
window.toggleCheat = function(btn) {
  const now = Date.now();
  if(!btn.lastClick) btn.lastClick = 0;
  if(!btn.clickCount) btn.clickCount = 0;
  if(now - btn.lastClick < 500) {
    btn.clickCount++;
  } else {
    btn.clickCount = 1;
  }
  btn.lastClick = now;
  if (btn.clickCount >= 3) {
    ritikAdmin = !ritikAdmin;
    btn.clickCount = 0;
  }
};
})();
</script>
